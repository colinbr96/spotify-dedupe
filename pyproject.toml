[project]
name = "spotify-dedupe"
version = "0.1.0"
description = "Find and remove duplicate tracks in your Spotify playlists."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "ty>=0.0.95",
]
